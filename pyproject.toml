[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "electrochemistry-raman-analysis"
version = "1.0.1"
description = "Auditable RamanSPy processing of Optosky electrochemical Raman spectra"
requires-python = ">=3.11"
dependencies = ["ramanspy==0.2.10", "numpy>=2.0", "scipy>=1.12", "pandas>=2.1", "matplotlib>=3.8", "PyYAML>=6", "pybaselines>=1.2", "Markdown>=3.6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
electrochemistry-raman = "optosky_raman.cli:main"
optosky-raman = "optosky_raman.cli:main"

[tool.setuptools.packages.find]
include = ["optosky_raman*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
